name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full TypeScript compatibility sweep (ADR-0014).
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Both compilers must agree: TypeScript 6 emits, TypeScript 7 verifies (ADR-0012).
      - run: npm run typecheck

  architecture:
    name: Architecture checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check:arch

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The published Node floor is 22.12 (ADR-0010); 24 is the current LTS.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit

  browser:
    name: Rendering integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser

  contract:
    name: Contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:contract

  e2e:
    name: Host E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run build --workspace @kajay/host-demo
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  pack:
    name: Pack test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Default matrix: floor, the 6.x line, and current (ADR-0014).
      - run: npm run test:pack

  typescript-sweep:
    name: TypeScript compatibility sweep
    # Weekly only: proves no intermediate version regressed, without charging every
    # pull request for seven compiler installs.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:pack
        env:
          KAJAY_TS_MATRIX: '5.5,5.6,5.7,5.8,5.9,~6.0.3,^7.0.2'

  # The single required status for branch protection. Adding a job above means adding
  # it to `needs` here — never editing the protected-checks list.
  survey-checks:
    name: survey-checks
    runs-on: ubuntu-latest
    if: always()
    needs: [lint-typecheck, architecture, unit, browser, contract, e2e, pack]
    steps:
      - name: Fail if any upstream job did not succeed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more checks failed."
            exit 1
          fi
          echo "All checks passed."
