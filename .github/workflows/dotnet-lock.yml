name: Regenerate .NET lock files

# **Manual, and it exists because a lock file is only true where it was made.**
#
# `packages.lock.json` records a content hash per package. A restore run on a developer
# machine records whatever copy that machine's SDK bundles, which for SDK-injected packages
# — `Microsoft.NET.ILLink.Tasks`, pulled in by `IsTrimmable` — is not the copy nuget.org
# serves. The hash then cannot be reproduced anywhere else and `--locked-mode` fails on
# every other machine, which is precisely what CI hit with NU1403: three byte-streams for
# one version number.
#
# So the lock files are generated here, on the platform and from the feed that CI restores
# from, and the result is downloaded and committed. Running `dotnet restore
# --force-evaluate` locally produces a file that passes locally and nowhere else.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate on ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # The same pin `global.json` names, so the lock file this produces belongs to the
          # SDK that will later be asked to honour it.
          global-json-file: global.json

      - name: Restore, evaluating afresh
        run: dotnet restore dotnet/Kajay.slnx --force-evaluate

      # Reported rather than left for the diff to explain: a hash that changed is the whole
      # point of the run, and a run that changed nothing means the lock files were already
      # right and the failure is somewhere else.
      - name: Show what moved
        run: |
          if git diff --quiet -- '**/packages.lock.json'; then
            echo "No change. The lock files already matched this platform and feed."
          else
            git diff --stat -- '**/packages.lock.json'
            git diff -- '**/packages.lock.json' | grep -E '^[-+].*contentHash' || true
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-lock-files
          # Every lock file, not only the one that failed: they are generated together and
          # a partially-regenerated set is a new inconsistency rather than a fix.
          path: dotnet/**/packages.lock.json
          if-no-files-found: error
