name: kajay-sdk-demo

services:
  kajay-dotnet-api:
    profiles: [dotnet, compare, workflow]
    build:
      context: .
      dockerfile: dotnet/apps/Kajay.Demo.Api/Dockerfile
    expose:
      - "8080"

  kajay-typescript-api:
    profiles: [typescript, compare, workflow]
    build:
      context: .
      dockerfile: apps/sdk-demo-api/Dockerfile
    expose:
      - "8080"

  kajay-dotnet-demo:
    profiles: [dotnet]
    build:
      context: .
      dockerfile: apps/sdk-demo/Dockerfile
      target: dotnet
      args:
        VITE_KAJAY_RUNTIME: dotnet
    depends_on:
      - kajay-dotnet-api
    ports:
      - "4173:80"

  kajay-typescript-demo:
    profiles: [typescript]
    build:
      context: .
      dockerfile: apps/sdk-demo/Dockerfile
      target: typescript
      args:
        VITE_KAJAY_RUNTIME: typescript
    depends_on:
      - kajay-typescript-api
    ports:
      - "4173:80"

  kajay-compare-demo:
    profiles: [compare]
    build:
      context: .
      dockerfile: apps/sdk-demo/Dockerfile
      target: compare
      args:
        VITE_KAJAY_RUNTIME: compare
    depends_on:
      - kajay-dotnet-api
      - kajay-typescript-api
    ports:
      - "4173:80"

  kajay-workflow-db:
    profiles: [workflow]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: kajay
      POSTGRES_USER: kajay
      POSTGRES_PASSWORD: kajay
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U kajay -d kajay"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - kajay-workflow-data:/var/lib/postgresql

  kajay-workflow-host:
    profiles: [workflow]
    build:
      context: .
      dockerfile: dotnet/apps/Kajay.Workflow.Host/Dockerfile
    depends_on:
      kajay-workflow-db:
        condition: service_healthy
    environment:
      ConnectionStrings__Workflow: Host=kajay-workflow-db;Port=5432;Database=kajay;Username=kajay;Password=kajay
      WorkOS__ApiBaseUrl: ${WORKOS_API_BASE_URL:-https://api.workos.com}
      WorkOS__Audience: ${WORKOS_AUDIENCE:-}
      WorkOS__ClientId: ${WORKOS_CLIENT_ID:-}
      WorkOS__Issuer: ${WORKOS_ISSUER:-https://api.workos.com/}
      WorkOS__RequireHttpsMetadata: ${WORKOS_REQUIRE_HTTPS_METADATA:-true}
      WorkOS__Session__ApiKey: ${WORKOS_API_KEY:-}
      WorkOS__Session__BrowserBaseUrl: ${WORKOS_BROWSER_BASE_URL:-https://api.workos.com}
      WorkOS__Session__CallbackUrl: ${WORKOS_CALLBACK_URL:-https://localhost:5082/auth/callback}
      WorkOS__Session__Enabled: ${WORKOS_SESSION_ENABLED:-false}
      WorkOS__Session__PostLoginRedirectUrl: ${WORKOS_POST_LOGIN_REDIRECT_URL:-https://localhost:5082/auth/session}
      WorkOS__Session__PostLogoutRedirectUrl: ${WORKOS_POST_LOGOUT_REDIRECT_URL:-https://localhost:5082/health}
      WorkflowWorkers__Enabled: "true"
    ports:
      - "5082:8080"

  kajay-workflow-demo:
    profiles: [workflow]
    build:
      context: .
      dockerfile: apps/sdk-demo/Dockerfile
      target: workflow
      args:
        VITE_KAJAY_RUNTIME: compare
    depends_on:
      - kajay-dotnet-api
      - kajay-typescript-api
      - kajay-workflow-host
    ports:
      - "4175:80"

volumes:
  kajay-workflow-data:
