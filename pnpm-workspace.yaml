# Workspace definition. Replaces the `workspaces` field in package.json, which pnpm
# does not read.
packages:
  - 'packages/*'
  - 'apps/*'

# Postinstall scripts are denied by default; these two are allowed because they are how
# the tool arrives. `esbuild` and `workerd` ship a platform binary that their install step
# links — a denied build leaves the package present and the binary missing, which fails at
# the first `wrangler` invocation rather than at install.
allowBuilds:
  esbuild: true
  workerd: true

# One place to pin versions shared across the workspace (ADR-0015). This is the
# concrete reason the swap was worth making: the single version train (ADR-0005) wants
# every package on the same React, and npm had no equivalent to this.
#
# Library *peer* ranges deliberately stay literal in their manifests: a peer range is a
# consumer-facing statement about breadth (`^19`), not a statement about the version
# this workspace happens to develop against.
catalog:
  react: ^19.2.8
  react-dom: ^19.2.8

minimumReleaseAgeExclude:
  - '@tanstack/react-start-rsc@0.1.34'
  - '@tanstack/react-start-server@1.167.23'
  - '@tanstack/react-start@1.168.35'
  - '@tanstack/start-plugin-core@1.171.26'
  - '@tanstack/start-server-core@1.169.18'
